<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro cálido acorde al tema -->
    <rect id="bg" width="64" height="64" rx="14" fill="#1a0f0a"/>

    <!-- Gradiente del punto rojo/coral idéntico a la esfera -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f07b5e"/>
      <stop offset="45%" stop-color="#e85d3a"/>
      <stop offset="80%" stop-color="#c44a2a"/>
      <stop offset="100%" stop-color="#8b2a10"/>
    </radialGradient>

    <!-- Halo luminoso sutil -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo tipo icono app -->
  <use href="#bg"/>

  <!-- Halo de calor del punto -->
  <circle cx="32" cy="32" r="16" fill="#e85d3a" opacity="0.25" filter="url(#glow)"/>

  <!-- Punto rojo/coral "." -->
  <circle cx="32" cy="32" r="12" fill="url(#dotGrad)"/>

  <!-- Brillo specular superior -->
  <circle cx="28" cy="28" r="3.5" fill="#ffffff" opacity="0.3"/>
</svg>
